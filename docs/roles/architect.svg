<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 56" width="60" height="56"><style>
.run .la{animation:sc-st .5s steps(1) infinite}.run .lb{animation:sc-st .5s steps(1) infinite -.25s}
.run .bd{animation:sc-bob .5s steps(1) infinite -.125s}
.run g{transform-box:fill-box}
@keyframes sc-st{50%{transform:translateY(-1px)}}@keyframes sc-bob{50%{transform:translateY(1px)}}
@keyframes sc-blink{50%{opacity:.15}}@keyframes sc-up{50%{transform:translateY(-1px)}}@keyframes sc-down{50%{transform:translateY(1px)}}
.c-apprentice.run .brw{animation:sc-up .5s steps(1) infinite}
.c-apprentice.run .whl{transform-origin:50% 50%;animation:sc-spin 1s steps(4) infinite}
@keyframes sc-spin{to{transform:rotate(360deg)}}
.c-laborer.run .jh{animation:sc-up .25s steps(1) infinite}
.c-laborer.run .ds1{animation:sc-blink .25s steps(1) infinite}
.c-laborer.run .ds2{animation:sc-blink .25s steps(1) infinite -.125s}
.c-bricklayer.run .tw{animation:sc-tap .5s steps(1) infinite}
@keyframes sc-tap{50%{transform:translateY(2px)}}
.c-carpenter.run .hm{transform-origin:30% 100%;animation:sc-swing .5s ease-in-out infinite}
@keyframes sc-swing{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(20deg)}}
.c-inspector.run .ck{animation:sc-blink 1s steps(1) infinite}
.c-inspector.run .pn{animation:sc-down .5s steps(1) infinite}
.c-foreman.run .lt{animation:sc-blink .5s steps(1) infinite}
.c-foreman.run .wv{animation:sc-blink 1s steps(1) infinite}
.c-foreman.run .wv2{animation:sc-blink 1s steps(1) infinite -.5s}
.c-engineer.run .bb{animation:sc-slide 1s ease-in-out infinite}
@keyframes sc-slide{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
.c-architect.run .l1{animation:sc-shim 1s ease-in-out infinite}
.c-architect.run .l2{animation:sc-shim 1s ease-in-out infinite -.5s}
@keyframes sc-shim{50%{opacity:.3}}
.c-surveyor.run .lz{animation:sc-blink .5s steps(1) infinite}
.c-planner.run .g1,.c-planner.run .g2,.c-planner.run .g3{transform-origin:0 50%;animation:sc-grow 1s ease-out infinite}
.c-planner.run .g2{animation-delay:-.25s}.c-planner.run .g3{animation-delay:-.5s}
@keyframes sc-grow{0%{transform:scaleX(.25)}70%,100%{transform:scaleX(1)}}
.c-sub.run .tb{transform-origin:50% 0;animation:sc-rock 1s ease-in-out infinite}
@keyframes sc-rock{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@media (prefers-reduced-motion: reduce){.run,.run g{animation:none!important}}
 rect{shape-rendering:crispEdges}</style><g transform="translate(0,0) scale(2)" opacity="1" shape-rendering="crispEdges"><g class="c-architect run"><g class="bd"><rect x="7" y="10" width="16" height="12" fill="#D97757"/><rect x="3" y="14" width="4" height="4" fill="#D97757"/><rect x="23" y="10" width="4" height="4" fill="#D97757"/><rect x="9" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="19" y="12" width="2" height="2" fill="#1F1E1D"/><rect x="12" y="3" width="6" height="1" fill="#8E9399"/><rect x="10" y="4" width="2" height="1" fill="#8E9399"/><rect x="18" y="4" width="2" height="1" fill="#8E9399"/><rect x="9" y="5" width="1" height="1" fill="#8E9399"/><rect x="20" y="5" width="1" height="1" fill="#8E9399"/><rect x="8" y="6" width="1" height="3" fill="#8E9399"/><rect x="21" y="6" width="1" height="3" fill="#8E9399"/><rect x="4" y="9" width="1" height="1" fill="#8E9399"/><rect x="25" y="9" width="1" height="1" fill="#8E9399"/><rect x="12" y="4" width="6" height="1" fill="#F3F3F0"/><rect x="10" y="5" width="10" height="1" fill="#F3F3F0"/><rect x="9" y="6" width="12" height="3" fill="#F3F3F0"/><rect x="14" y="4" width="2" height="5" fill="#FFFFFF"/><rect x="10" y="6" width="1" height="2" fill="#FFFFFF"/><rect x="20" y="6" width="1" height="3" fill="#B9B9B3"/><rect x="9" y="7" width="12" height="1" fill="#E0B23A"/><rect x="5" y="9" width="20" height="1" fill="#F3F3F0"/><rect x="5" y="9" width="1" height="1" fill="#B9B9B3"/><rect x="24" y="9" width="1" height="1" fill="#B9B9B3"/><rect x="9" y="11" width="2" height="1" fill="#F2E7C4"/><rect x="9" y="14" width="2" height="1" fill="#F2E7C4"/><rect x="8" y="12" width="1" height="2" fill="#F2E7C4"/><rect x="11" y="12" width="1" height="2" fill="#F2E7C4"/><rect x="19" y="11" width="2" height="1" fill="#F2E7C4"/><rect x="19" y="14" width="2" height="1" fill="#F2E7C4"/><rect x="18" y="12" width="1" height="2" fill="#F2E7C4"/><rect x="21" y="12" width="1" height="2" fill="#F2E7C4"/><rect x="12" y="12" width="1" height="1" fill="#F2E7C4"/><rect x="17" y="12" width="1" height="1" fill="#F2E7C4"/><rect x="13" y="11" width="4" height="1" fill="#F2E7C4"/><rect x="23" y="1" width="7" height="1" fill="#9CC0EE"/><rect x="23" y="2" width="7" height="8" fill="#2457A6"/><rect x="23" y="10" width="7" height="1" fill="#9CC0EE"/><g class="l1"><rect x="23" y="4" width="7" height="1" fill="#D6E4F7"/><rect x="23" y="7" width="7" height="1" fill="#D6E4F7"/></g><g class="l2"><rect x="25" y="2" width="1" height="8" fill="#D6E4F7"/><rect x="28" y="2" width="1" height="8" fill="#D6E4F7"/></g></g><g class="la"><rect x="7" y="22" width="2" height="4" fill="#D97757"/><rect x="17" y="22" width="2" height="4" fill="#D97757"/></g><g class="lb"><rect x="11" y="22" width="2" height="4" fill="#D97757"/><rect x="21" y="22" width="2" height="4" fill="#D97757"/></g></g></g></svg>
